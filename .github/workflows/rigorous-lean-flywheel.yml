name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel
      - agent/rigorous-lean-capital-flywheel-o7
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O7 dependency cone
        run: |
          lake build equational_theories.Completeness
          lake build equational_theories.FunctionSpaceLiftObstruction
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.FunctionSpaceLiftObstruction
          #print axioms typeChoiceSchema_of_surjective_familyLift
          #print axioms embed_surjective
          #print axioms phiAsSubst_aux_is_familyLift_instance
          #print axioms phiAsSubst_aux_of_familyLift
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O7 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(typeChoiceSchema_of_surjective_familyLift|embed_surjective|phiAsSubst_aux_of_familyLift).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in constructive O7 targets.'
            exit 1
          fi
