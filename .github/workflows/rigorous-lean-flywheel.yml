name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build flywheel capabilities
        run: |
          lake build equational_theories.FreeMagmaEvalCongr
          lake build equational_theories.Definability.FreeMagmaTerm
          lake build equational_theories.Definability.Law43
          lake build equational_theories.Definability.Law46
          lake build equational_theories.Definability.Tarski543
          lake build equational_theories.CompletenessFiniteSupport
          lake build equational_theories.FiniteOverrideObstruction
          lake build equational_theories.OccurrenceLift
          lake build equational_theories.SupportLocalDerivation
          lake build equational_theories.SupportSemanticBoundary
          lake build equational_theories.CompletenessSupportResources
          lake build equational_theories.CompletenessSingletonSupport
          lake build equational_theories.CompletenessIndexedSupport
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.Definability.FreeMagmaTerm
          import equational_theories.CompletenessFiniteSupport
          import equational_theories.FiniteOverrideObstruction
          import equational_theories.OccurrenceLift
          import equational_theories.SupportLocalDerivation
          import equational_theories.SupportSemanticBoundary
          import equational_theories.CompletenessSupportResources
          import equational_theories.CompletenessSingletonSupport
          import equational_theories.CompletenessIndexedSupport
          #print axioms FreeMagma.evalInMagma_congr
          #print axioms FreeMagma.eval_termDefinable
          #print axioms FreeMagma.eval_comp_termDefinable
          #print axioms FreeMagmaWithLaws.isModel
          #print axioms Completeness'
          #print axioms FreeMagmaWithLaws.isModel_decidableVars
          #print axioms Completeness'_decidableVars
          #print axioms Completeness_decidableVars
          #print axioms CompletenessNat_noGlobalChoice
          #print axioms weakEqDecision_of_onePointOverride
          #print axioms eqOrNe_of_onePointOverride_of_stableEq
          #print axioms occurrenceLift_exists
          #print axioms occurrenceLift_eval_eq_embed
          #print axioms eval_has_occurrence_rep
          #print axioms occurrence_representatives_derivably_equal
          #print axioms FreeMagma.supportSubst_eq_eval_of_agree
          #print axioms deriveSupport'_of_derive'
          #print axioms supportRetract_iff_allValuationExtensions
          #print axioms FreeMagmaWithLaws.isModel_supportResources
          #print axioms Completeness'_supportResources
          #print axioms supportRetract_of_singletonSupport
          #print axioms Completeness'_singletonSupport
          #print axioms chooseFinFamily
          #print axioms supportQuotientLift_of_indexing
          #print axioms Completeness'_indexedSupport
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(isModel_decidableVars|Completeness'_decidableVars|Completeness_decidableVars|CompletenessNat_noGlobalChoice|weakEqDecision_of_onePointOverride|eqOrNe_of_onePointOverride_of_stableEq|occurrenceLift_exists|occurrenceLift_eval_eq_embed|eval_has_occurrence_rep|occurrence_representatives_derivably_equal|supportSubst_eq_eval_of_agree|deriveSupport'_of_derive'|supportRetract_iff_allValuationExtensions|isModel_supportResources|Completeness'_supportResources|supportRetract_of_singletonSupport|Completeness'_singletonSupport|chooseFinFamily|supportQuotientLift_of_indexing|Completeness'_indexedSupport).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in a verified flywheel target.'
            exit 1
          fi
