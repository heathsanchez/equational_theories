name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o12
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O12 dependency cone
        run: |
          lake build equational_theories.SupportLocalConservativity
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.SupportLocalConservativity
          #print axioms SupportRetractionData.toSupportRetract
          #print axioms totalizeSupportAssignment_of_data_agree
          #print axioms derive'_of_deriveSupport'_retractionData
          #print axioms supportRetractionData_of_decidableEq
          #print axioms derive'_of_deriveSupport'_via_retractionData_decidable
          #print axioms totalization_merely_exists_of_retract
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O12 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(toSupportRetract|totalizeSupportAssignment_of_data_agree|derive'_of_deriveSupport'_retractionData|supportRetractionData_of_decidableEq|derive'_of_deriveSupport'_via_retractionData_decidable|totalization_merely_exists_of_retract).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O12 targets.'
            exit 1
          fi
