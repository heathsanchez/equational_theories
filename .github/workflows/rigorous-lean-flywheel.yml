name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o32
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O32 dependency cone
        run: |
          lake build equational_theories.AssociativityQuotientNormalizer
          lake build equational_theories.InvariantReconstructionNormalizer
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.InvariantReconstructionNormalizer
          #print axioms QuotientNormalizerData.ofInvariantReconstruction
          #print axioms contextQuotientSections_of_invariantReconstruction
          #print axioms Completeness'_invariantReconstruction
          #print axioms invariantReconstructionData_associativity
          #print axioms contextQuotientSections_associativity_viaInvariant
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O32 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(ofInvariantReconstruction|contextQuotientSections_of_invariantReconstruction|Completeness'_invariantReconstruction|invariantReconstructionData_associativity|contextQuotientSections_associativity_viaInvariant).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O32 targets.'
            exit 1
          fi
