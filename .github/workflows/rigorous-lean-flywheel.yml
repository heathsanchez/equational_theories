name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o30
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O30 dependency cone
        run: |
          lake build equational_theories.QuotientNormalizerSection
          lake build equational_theories.AssociativityQuotientNormalizer
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.AssociativityQuotientNormalizer
          #print axioms derive'_associativity_step
          #print axioms derive'_assoc_canon_append
          #print axioms derive'_associativity_reduce
          #print axioms derive'_associativity_toList_eq
          #print axioms quotientNormalizerData_associativity
          #print axioms contextQuotientSections_associativity
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O30 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(derive'_associativity_step|derive'_assoc_canon_append|derive'_associativity_reduce|derive'_associativity_toList_eq|quotientNormalizerData_associativity|contextQuotientSections_associativity).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O30 targets.'
            exit 1
          fi
