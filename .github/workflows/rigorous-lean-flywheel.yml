name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o13
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O13 dependency cone
        run: |
          lake build equational_theories.CompletenessIndexedSupport
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.CompletenessIndexedSupport
          #print axioms chooseFinFamily
          #print axioms supportQuotientLift_of_indexing
          #print axioms supportResources_of_indexing
          #print axioms FreeMagmaWithLaws.isModel_indexedSupport
          #print axioms Completeness'_indexedSupport
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O13 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(chooseFinFamily|supportQuotientLift_of_indexing|supportResources_of_indexing|isModel_indexedSupport|Completeness'_indexedSupport).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O13 targets.'
            exit 1
          fi
