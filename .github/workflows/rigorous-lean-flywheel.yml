name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel
      - agent/rigorous-lean-capital-flywheel-o6
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O6 dependency cone
        run: |
          lake build equational_theories.CompletenessFiniteSupport
          lake build equational_theories.OccurrenceLift
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.OccurrenceLift
          #print axioms occurrenceLift_exists
          #print axioms occurrenceLift_eval_eq_embed
          #print axioms eval_has_occurrence_rep
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O6 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(occurrenceLift_exists|occurrenceLift_eval_eq_embed|eval_has_occurrence_rep).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice remains in O6.'
            exit 1
          fi
