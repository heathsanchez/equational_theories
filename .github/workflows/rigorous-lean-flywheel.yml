name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o16
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O16 dependency cone
        run: |
          lake build equational_theories.CompletenessOccurrenceMaterialization
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.CompletenessOccurrenceMaterialization
          #print axioms chooseOccurrenceFamily
          #print axioms lawMem_iff_occurrenceTreeMem
          #print axioms supportQuotientLift_of_positionData
          #print axioms computableLawSupport_resources
          #print axioms FreeMagmaWithLaws.isModel_occurrenceMaterialized
          #print axioms Completeness'_occurrenceMaterialized
          #print axioms computableLawSupport_of_decidableEq
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O16 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(chooseOccurrenceFamily|lawMem_iff_occurrenceTreeMem|supportQuotientLift_of_positionData|computableLawSupport_resources|isModel_occurrenceMaterialized|Completeness'_occurrenceMaterialized|computableLawSupport_of_decidableEq).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O16 targets.'
            exit 1
          fi
