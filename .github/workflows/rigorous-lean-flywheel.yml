name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o25
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O25 dependency cone
        run: |
          lake build equational_theories.CanonicalQuotientSection
          lake build equational_theories.LeftProjectionCanonicalSection
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.LeftProjectionCanonicalSection
          #print axioms derive'_leftProjection_first_eq
          #print axioms derive'_leftProjection_reduce
          #print axioms FreeMagmaWithLaws.unembedLeftProjection
          #print axioms FreeMagmaWithLaws.embed_unembedLeftProjection
          #print axioms quotientRepresentativeData_leftProjection
          #print axioms supportQuotientLift_leftProjection
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O25 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(derive'_leftProjection_first_eq|derive'_leftProjection_reduce|unembedLeftProjection|embed_unembedLeftProjection|quotientRepresentativeData_leftProjection|supportQuotientLift_leftProjection).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O25 targets.'
            exit 1
          fi
