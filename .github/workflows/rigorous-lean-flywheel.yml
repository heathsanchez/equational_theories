name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-integrate-o27
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build cumulative O1-O29 cone
        run: |
          lake build equational_theories.FreeMagmaEvalCongr
          lake build equational_theories.Definability.FreeMagmaTerm
          lake build equational_theories.Definability.Law43
          lake build equational_theories.Definability.Law46
          lake build equational_theories.Definability.Tarski543
          lake build equational_theories.CompletenessFiniteSupport
          lake build equational_theories.FiniteOverrideObstruction
          lake build equational_theories.OccurrenceLift
          lake build equational_theories.SupportLocalDerivation
          lake build equational_theories.SupportSemanticBoundary
          lake build equational_theories.CompletenessSupportResources
          lake build equational_theories.CompletenessSingletonSupport
          lake build equational_theories.CompletenessIndexedSupport
          lake build equational_theories.SupportLocalConservativity
          lake build equational_theories.SupportLocalExistentialConservativity
          lake build equational_theories.OccurrencePositionBoundary
          lake build equational_theories.CompletenessOccurrenceMaterialization
          lake build equational_theories.OccurrenceMaterializationEqualityBoundary
          lake build equational_theories.OccurrenceMaterializationPropBoundary
          lake build equational_theories.SupportExtensionNecessity
          lake build equational_theories.SupportQuotientLiftNormalForm
          lake build equational_theories.SupportFiniteChoiceBoundary
          lake build equational_theories.SupportFamilyChoiceExactness
          lake build equational_theories.EmptyTheoryQuotientSection
          lake build equational_theories.CanonicalQuotientSection
          lake build equational_theories.LeftProjectionCanonicalSection
          lake build equational_theories.RightProjectionCanonicalSection
          lake build equational_theories.AmbientLeftProjectionCompleteness
          lake build equational_theories.CompletenessCanonicalSections
          lake build equational_theories.QuotientNormalizerSection
      - name: Widened axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.QuotientNormalizerSection
          import equational_theories.RightProjectionCanonicalSection
          import equational_theories.AmbientLeftProjectionCompleteness
          import equational_theories.SupportFamilyChoiceExactness
          import equational_theories.SupportExtensionNecessity
          #print axioms CompletenessNat_noGlobalChoice
          #print axioms Completeness'_supportResources
          #print axioms supportRetract_iff_allSupportSubstitutionExtensions
          #print axioms supportQuotientLift_iff_supportIndexedSection
          #print axioms supportFamilyChoice_iff_nonempty_positionData
          #print axioms derive'_empty_eq
          #print axioms quotientRepresentativeData_empty
          #print axioms supportQuotientLift_of_globalSections
          #print axioms derive'_leftProjection_first_eq
          #print axioms derive'_leftProjection_reduce
          #print axioms quotientRepresentativeData_leftProjection
          #print axioms derive'_rightProjection_last_eq
          #print axioms derive'_rightProjection_reduce
          #print axioms quotientRepresentativeData_rightProjection
          #print axioms contextSupportRetract_ambientLeftProjection
          #print axioms Completeness'_ambientLeftProjection
          #print axioms supportQuotientLift_of_contextSections
          #print axioms Completeness'_canonicalSections
          #print axioms quotientRepresentativeData_of_normalizer
          #print axioms contextQuotientSections_of_normalizers
          #print axioms Completeness'_normalizers
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid cumulative axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(CompletenessNat_noGlobalChoice|Completeness'_supportResources|supportRetract_iff_allSupportSubstitutionExtensions|supportQuotientLift_iff_supportIndexedSection|supportFamilyChoice_iff_nonempty_positionData|derive'_empty_eq|quotientRepresentativeData_empty|supportQuotientLift_of_globalSections|derive'_leftProjection_first_eq|derive'_leftProjection_reduce|quotientRepresentativeData_leftProjection|derive'_rightProjection_last_eq|derive'_rightProjection_reduce|quotientRepresentativeData_rightProjection|contextSupportRetract_ambientLeftProjection|Completeness'_ambientLeftProjection|supportQuotientLift_of_contextSections|Completeness'_canonicalSections|quotientRepresentativeData_of_normalizer|contextQuotientSections_of_normalizers|Completeness'_normalizers).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in cumulative verified targets.'
            exit 1
          fi
