name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o19
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O19-O22 dependency cone
        run: |
          lake build equational_theories.SupportExtensionNecessity
          lake build equational_theories.SupportQuotientLiftNormalForm
          lake build equational_theories.SupportFiniteChoiceBoundary
          lake build equational_theories.SupportFamilyChoiceExactness
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.SupportExtensionNecessity
          import equational_theories.SupportQuotientLiftNormalForm
          import equational_theories.SupportFiniteChoiceBoundary
          import equational_theories.SupportFamilyChoiceExactness
          #print axioms supportSubstitutionExtension_of_supportRetract
          #print axioms supportRetract_of_supportSubstitutionExtension
          #print axioms supportRetract_iff_allSupportSubstitutionExtensions
          #print axioms supportQuotientLift_iff_supportIndexedSection
          #print axioms totalSubst_of_supportSection
          #print axioms supportIndexedSection_of_supportFamilyChoice
          #print axioms supportQuotientLift_of_supportFamilyChoice
          #print axioms twoLeafMemPositionData_of_supportFamilyChoice
          #print axioms eqOrNe_of_twoLeafSupportFamilyChoice
          #print axioms supportFamilyChoice_of_decidableEq
          #print axioms supportFamilyChoice_iff_nonempty_positionData
          #print axioms nonempty_positionData_iff_supportFamilyChoice
          #print axioms supportQuotientLift_of_nonempty_positionData
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O19-O22 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(supportSubstitutionExtension_of_supportRetract|supportRetract_of_supportSubstitutionExtension|supportRetract_iff_allSupportSubstitutionExtensions|supportQuotientLift_iff_supportIndexedSection|totalSubst_of_supportSection|supportIndexedSection_of_supportFamilyChoice|supportQuotientLift_of_supportFamilyChoice|twoLeafMemPositionData_of_supportFamilyChoice|eqOrNe_of_twoLeafSupportFamilyChoice|supportFamilyChoice_of_decidableEq|supportFamilyChoice_iff_nonempty_positionData|nonempty_positionData_iff_supportFamilyChoice|supportQuotientLift_of_nonempty_positionData).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O19-O22 targets.'
            exit 1
          fi
