name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o29
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O29 dependency cone
        run: |
          lake build equational_theories.CompletenessCanonicalSections
          lake build equational_theories.QuotientNormalizerSection
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.QuotientNormalizerSection
          #print axioms quotientRepresentativeData_of_normalizer
          #print axioms quotientRepresentativeSection_of_normalizer
          #print axioms contextQuotientSections_of_normalizers
          #print axioms Completeness'_normalizers
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O29 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(quotientRepresentativeData_of_normalizer|quotientRepresentativeSection_of_normalizer|contextQuotientSections_of_normalizers|Completeness'_normalizers).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O29 targets.'
            exit 1
          fi
