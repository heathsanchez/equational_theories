name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o34
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run O34 bounded discovery
        run: |
          python3 experiments/normalizer_discovery_o34.py | tee /tmp/o34.txt
      - name: Verify calibration and discovery verdict
        run: |
          grep -q '^O34_VERDICT=PASS$' /tmp/o34.txt
          grep -q '^NEW_CANDIDATE=rectangular_two_axiom:leaf_first_last$' /tmp/o34.txt
          grep -q '^NEGATIVE_CONTROLS=idempotence,commutativity:no_exact_observer_in_frozen_grammar$' /tmp/o34.txt
