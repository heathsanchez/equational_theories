name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o26
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O26 dependency cone
        run: |
          lake build equational_theories.LeftProjectionCanonicalSection
          lake build equational_theories.AmbientLeftProjectionCompleteness
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.AmbientLeftProjectionCompleteness
          #print axioms derive'_ambientLeftProjection_first_eq
          #print axioms derive'_ambientLeftProjection_reduce
          #print axioms FreeMagmaWithLaws.unembedAmbientLeftProjection
          #print axioms FreeMagmaWithLaws.embed_unembedAmbientLeftProjection
          #print axioms quotientRepresentativeData_ambientLeftProjection
          #print axioms supportRetractionData_ambientLeftProjection
          #print axioms supportQuotientLift_ambientLeftProjection
          #print axioms contextSupportRetract_ambientLeftProjection
          #print axioms Completeness'_ambientLeftProjection
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O26 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(derive'_ambientLeftProjection_first_eq|derive'_ambientLeftProjection_reduce|unembedAmbientLeftProjection|embed_unembedAmbientLeftProjection|quotientRepresentativeData_ambientLeftProjection|supportRetractionData_ambientLeftProjection|supportQuotientLift_ambientLeftProjection|contextSupportRetract_ambientLeftProjection|Completeness'_ambientLeftProjection).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O26 targets.'
            exit 1
          fi
