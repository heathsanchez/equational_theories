name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel
      - agent/rigorous-lean-capital-flywheel-o9
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O9 dependency cone
        run: |
          lake build equational_theories.MagmaLaw
          lake build equational_theories.SupportSemanticBoundary
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.SupportSemanticBoundary
          #print axioms supportValuationExtension_of_retract
          #print axioms supportRetract_of_allValuationExtensions
          #print axioms supportRetract_iff_allValuationExtensions
          #print axioms satisfies_of_attach_noDecide
          #print axioms satisfies_attach_of_supportExtension
          #print axioms satisfies_attach_iff_of_retract
          #print axioms supportRetract_of_decidableEq
          #print axioms satisfies_attach_via_decidableRetract
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O9 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(supportValuationExtension_of_retract|supportRetract_of_allValuationExtensions|supportRetract_iff_allValuationExtensions|satisfies_of_attach_noDecide|satisfies_attach_of_supportExtension|satisfies_attach_iff_of_retract|supportRetract_of_decidableEq|satisfies_attach_via_decidableRetract).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O9 targets.'
            exit 1
          fi
