name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o18
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O18 dependency cone
        run: |
          lake build equational_theories.OccurrenceMaterializationPropBoundary
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.OccurrenceMaterializationPropBoundary
          #print axioms FreeMagma.eqOrNe_of_twoLeafMemPositionData
          #print axioms FreeMagma.equalitySplit_of_pairwiseTwoLeafMaterialization
          #print axioms FreeMagma.pairwiseTwoLeafMaterialization_of_nonempty_decidableEq
          #print axioms FreeMagma.pairwiseTwoLeafMaterialization_of_uniform
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O18 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(eqOrNe_of_twoLeafMemPositionData|equalitySplit_of_pairwiseTwoLeafMaterialization|pairwiseTwoLeafMaterialization_of_nonempty_decidableEq|pairwiseTwoLeafMaterialization_of_uniform).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O18 targets.'
            exit 1
          fi
