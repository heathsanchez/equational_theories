name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel
      - agent/rigorous-lean-capital-flywheel-o5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: lake update
      - name: Build flywheel capabilities
        run: |
          lake build equational_theories.FreeMagmaEvalCongr
          lake build equational_theories.Definability.FreeMagmaTerm
          lake build equational_theories.Definability.Law43
          lake build equational_theories.Definability.Law46
          lake build equational_theories.Definability.Tarski543
          lake build equational_theories.CompletenessFiniteSupport
          lake build equational_theories.FiniteOverrideObstruction
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.Definability.FreeMagmaTerm
          import equational_theories.CompletenessFiniteSupport
          import equational_theories.FiniteOverrideObstruction
          #print axioms FreeMagma.evalInMagma_congr
          #print axioms FreeMagma.eval_termDefinable
          #print axioms FreeMagma.eval_comp_termDefinable
          #print axioms FreeMagmaWithLaws.isModel
          #print axioms Completeness'
          #print axioms FreeMagmaWithLaws.isModel_decidableVars
          #print axioms Completeness'_decidableVars
          #print axioms Completeness_decidableVars
          #print axioms CompletenessNat_noGlobalChoice
          #print axioms decidableEq_of_onePointOverride
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid axiom audit or sorry dependency.'
            exit 1
          fi
          echo '--- Baseline vs finite-support choice check ---'
          grep -E "FreeMagmaWithLaws.isModel'|Completeness'|Completeness_decidableVars|CompletenessNat_noGlobalChoice" /tmp/axioms.txt || true
          if grep -E "(isModel_decidableVars|Completeness'_decidableVars|Completeness_decidableVars|CompletenessNat_noGlobalChoice).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice remains in a finite-support target.'
            exit 1
          fi
