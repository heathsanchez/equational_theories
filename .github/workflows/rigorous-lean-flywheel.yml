name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o28
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O28 dependency cone
        run: |
          lake build equational_theories.CanonicalQuotientSection
          lake build equational_theories.RightProjectionCanonicalSection
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.RightProjectionCanonicalSection
          #print axioms derive'_rightProjection_last_eq
          #print axioms derive'_rightProjection_reduce
          #print axioms FreeMagmaWithLaws.unembedRightProjection
          #print axioms FreeMagmaWithLaws.embed_unembedRightProjection
          #print axioms quotientRepresentativeData_rightProjection
          #print axioms supportQuotientLift_rightProjection
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O28 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(derive'_rightProjection_last_eq|derive'_rightProjection_reduce|unembedRightProjection|embed_unembedRightProjection|quotientRepresentativeData_rightProjection|supportQuotientLift_rightProjection).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O28 targets.'
            exit 1
          fi
