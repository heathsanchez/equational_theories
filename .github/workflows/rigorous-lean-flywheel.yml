name: Rigorous Lean Flywheel

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o10
  workflow_dispatch:

concurrency:
  group: rigorous-lean-flywheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O10 dependency cone
        run: |
          lake build equational_theories.CompletenessSupportResources
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/AxiomAudit.lean <<'EOF'
          import equational_theories.CompletenessSupportResources
          #print axioms totalSubst_of_supportResources
          #print axioms FreeMagmaWithLaws.isModel_supportResources
          #print axioms Completeness'_supportResources
          #print axioms supportQuotientLift_of_decidableEq
          #print axioms FreeMagmaWithLaws.isModel_decidableVars_via_resources
          EOF
          lake env lean /tmp/AxiomAudit.lean | tee /tmp/axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/axioms.txt; then
            echo 'Invalid O10 axiom audit or sorry dependency.'
            exit 1
          fi
          if grep -E "(totalSubst_of_supportResources|isModel_supportResources|Completeness'_supportResources|supportQuotientLift_of_decidableEq|isModel_decidableVars_via_resources).*Classical.choice" /tmp/axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O10 targets.'
            exit 1
          fi
