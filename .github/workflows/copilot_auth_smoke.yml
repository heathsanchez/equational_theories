name: Copilot Auth Smoke

on:
  push:
    branches:
      - bench/copilot-auth-smoke
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run smoke request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          START=$(date +%s)
          copilot --model=auto --max-ai-credits=30 --no-ask-user --no-custom-instructions --no-remote --no-remote-export --output-format=json -p "Reply exactly READY" > smoke.jsonl 2>&1
          RC=$?
          END=$(date +%s)
          echo "exit=$RC"
          echo "seconds=$((END-START))"
          cat smoke.jsonl
          exit $RC
