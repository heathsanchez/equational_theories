name: Rigorous Lean O46 Support Local Completeness

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o46-direct
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O46 boundary
        run: lake build equational_theories.SupportLocalCompleteness
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/O46Audit.lean <<'EOF'
          import equational_theories.SupportLocalCompleteness
          #print axioms O46.eval_supportSubst
          #print axioms O46.SoundnessSupport'_u
          #print axioms O46.SoundnessSupport'
          EOF
          lake env lean /tmp/O46Audit.lean | tee /tmp/o46_axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx\|Classical.choice' /tmp/o46_axioms.txt; then exit 1; fi
