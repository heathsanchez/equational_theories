name: Rigorous Lean O32 Idempotence

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o31
  workflow_dispatch:

concurrency:
  group: rigorous-o32-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O32 separator
        run: |
          lake build equational_theories.IdempotenceNormalizerBoundary
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/O32Audit.lean <<'EOF'
          import equational_theories.IdempotenceNormalizerBoundary
          #print axioms derive'_idempotence_step
          #print axioms derive'_idempotence_reduce
          #print axioms idempotenceNormalize_respects
          #print axioms quotientNormalizerData_idempotence
          EOF
          lake env lean /tmp/O32Audit.lean | tee /tmp/o32_axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/o32_axioms.txt; then
            exit 1
          fi
          if grep -E "(derive'_idempotence_step|derive'_idempotence_reduce|idempotenceNormalize_respects|quotientNormalizerData_idempotence).*Classical.choice" /tmp/o32_axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O32.'
            exit 1
          fi
