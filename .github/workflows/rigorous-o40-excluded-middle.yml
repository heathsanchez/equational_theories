name: Rigorous Lean O40 Excluded Middle Boundary

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o40
  workflow_dispatch:

concurrency:
  group: rigorous-o40-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O40 boundary
        run: |
          lake build equational_theories.CompletenessExcludedMiddleBoundary
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/O40Audit.lean <<'EOF'
          import equational_theories.CompletenessExcludedMiddleBoundary
          #print axioms decidableEq_of_explicitExcludedMiddle
          #print axioms FreeMagmaWithLaws.isModel_of_explicitExcludedMiddle
          #print axioms Completeness'_of_explicitExcludedMiddle
          EOF
          lake env lean /tmp/O40Audit.lean | tee /tmp/o40_axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/o40_axioms.txt; then
            exit 1
          fi
          if grep -E "(decidableEq_of_explicitExcludedMiddle|isModel_of_explicitExcludedMiddle|Completeness'_of_explicitExcludedMiddle).*Classical.choice" /tmp/o40_axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O40.'
            exit 1
          fi
