name: Rigorous Lean O36 Idempotence Route Comparison

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o36
  workflow_dispatch:

concurrency:
  group: rigorous-o36-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O36 route
        run: |
          lake build equational_theories.CompletenessSingletonSupport
          lake build equational_theories.AmbientIdempotenceSingletonCompleteness
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/O36Audit.lean <<'EOF'
          import equational_theories.AmbientIdempotenceSingletonCompleteness
          #print axioms singletonSupport_ambientIdempotence
          #print axioms contextSingletonSupport_ambientIdempotence
          #print axioms Completeness'_ambientIdempotence_singletonRoute
          EOF
          lake env lean /tmp/O36Audit.lean | tee /tmp/o36_axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx' /tmp/o36_axioms.txt; then
            exit 1
          fi
          if grep -E "(singletonSupport_ambientIdempotence|contextSingletonSupport_ambientIdempotence|Completeness'_ambientIdempotence_singletonRoute).*Classical.choice" /tmp/o36_axioms.txt; then
            echo 'Classical.choice unexpectedly appears in O36.'
            exit 1
          fi
