name: Rigorous Lean O45 Existential Totalization Boundary

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o45
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O45 boundary
        run: lake build equational_theories.ExistentialTotalizationBoundary
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/O45Audit.lean <<'EOF'
          import equational_theories.ExistentialTotalizationBoundary
          #print axioms pointwiseSupportDecision_of_em_o45
          #print axioms totalSupportExtension_of_globalDecision_o45
          #print axioms nonemptyTotalSupportExtension_of_globalDecision_o45
          EOF
          lake env lean /tmp/O45Audit.lean | tee /tmp/o45_axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx\|Classical.choice' /tmp/o45_axioms.txt; then exit 1; fi
