name: Rigorous Lean O41 Global Decision Boundary

on:
  push:
    branches:
      - agent/rigorous-lean-capital-flywheel-o41
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        run: |
          for i in 1 2 3; do
            lake update && break
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build O41 boundary
        run: lake build equational_theories.CompletenessGlobalDecisionBoundary
      - name: Axiom audit
        run: |
          set -o pipefail
          cat > /tmp/O41Audit.lean <<'EOF'
          import equational_theories.CompletenessGlobalDecisionBoundary
          #print axioms decidableEq_of_globalDecisionOracle
          #print axioms FreeMagmaWithLaws.isModel_of_globalDecisionOracle
          #print axioms Completeness'_of_globalDecisionOracle
          EOF
          lake env lean /tmp/O41Audit.lean | tee /tmp/o41_axioms.txt
          if grep -q 'unknownIdentifier\|sorryAx\|Classical.choice' /tmp/o41_axioms.txt; then exit 1; fi
